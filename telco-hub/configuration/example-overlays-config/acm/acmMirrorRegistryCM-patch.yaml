---
- op: remove
  path: "/data/ca-bundle.crt"

- op: replace
  path: /data/registries.conf
  value: |
    unqualified-search-registries = ["registry.access.redhat.com", "docker.io"]
    short-name-mode = ""
    additional-layer-store-auth-helper = ""

    [[registry]]
      prefix = ""
      location = "registry.access.redhat.com/openshift4/ose-oauth-proxy"

      [[registry.mirror]]
        location = "brew.registry.redhat.io/openshift4/ose-oauth-proxy"
        pull-from-mirror = "digest-only"

    [[registry]]
      prefix = ""
      location = "registry.redhat.io/multicluster-engine"

      [[registry.mirror]]
        location = "brew.registry.redhat.io/multicluster-engine"
        pull-from-mirror = "digest-only"

      [[registry.mirror]]
        location = "quay.io:443/acm-d"
        pull-from-mirror = "digest-only"

    [[registry]]
      prefix = ""
      location = "registry.redhat.io/rhacm2"

      [[registry.mirror]]
        location = "brew.registry.redhat.io/rhacm2"
        pull-from-mirror = "digest-only"

      [[registry.mirror]]
        location = "quay.io:443/acm-d"
        pull-from-mirror = "digest-only"
